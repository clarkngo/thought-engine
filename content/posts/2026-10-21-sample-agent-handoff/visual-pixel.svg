  <rect x="68" y="838" width="960" height="190" fill="#2547d0"/>
  <rect x="60" y="830" width="960" height="190" fill="#1b1d21"/>
  <text x="100" y="878" font-size="30" font-weight="800" fill="#fff">Design the seams, not just the steps</text>
  <g font-size="25" fill="#d9dce3">
    <text x="100" y="928">1. Define a handoff contract: what must cross</text>
    <text x="100" y="964">2. Log every handoff, not only every output</text>
    <text x="100" y="1000">3. Test the seams before the steps</text>
  </g>
