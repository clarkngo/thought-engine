  <style>
    rect, path { shape-rendering: crispEdges; }
    .march { stroke-dasharray: 16 16; animation: march 0.6s steps(4) infinite; }
    @keyframes march { to { stroke-dashoffset: -32; } }
    .bob { animation: bob 0.6s steps(1) infinite; }
    @keyframes bob { 0% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .walk { animation: walk 6s steps(1) infinite; }
    @keyframes walk { 0% { transform: translateX(0); } 33% { transform: translateX(340px); } 66% { transform: translateX(680px); } }
    .stall { animation: stall 6s steps(1) infinite; }
    @keyframes stall { 0% { transform: translateX(0); } 33% { transform: translateX(340px); } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.2; } }
  </style>
