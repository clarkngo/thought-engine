<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Flat alternate of visual.svg. One 6s loop. Every animation's duration divides 6s so the loop is seamless. -->
  <style>
    .march { stroke-dasharray: 14 10; animation: march 0.6s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -24; } }

    .packet { animation: travel 6s linear infinite; }
    @keyframes travel {
      0%   { transform: translate(180px, 640px); opacity: 0; }
      6%   { transform: translate(180px, 640px); opacity: 1; }
      25%  { transform: translate(540px, 640px); }
      35%  { transform: translate(540px, 640px); }
      60%  { transform: translate(900px, 640px); opacity: 1; }
      88%  { transform: translate(900px, 640px); opacity: 1; }
      96%  { transform: translate(900px, 640px); opacity: 0; }
      100% { transform: translate(900px, 640px); opacity: 0; }
    }

    .lost { animation: drop 6s linear infinite; }
    .lost.b { animation-delay: 0.1s; }
    @keyframes drop {
      0%, 46% { transform: translate(0, 0) rotate(0); opacity: 1; }
      56%     { transform: translate(-20px, 150px) rotate(-35deg); opacity: 0; }
      100%    { transform: translate(-20px, 150px) rotate(-35deg); opacity: 0; }
    }

    .flash { animation: flash 6s linear infinite; }
    @keyframes flash {
      0%, 43%  { opacity: 0.18; }
      48%      { opacity: 1; }
      58%      { opacity: 1; }
      66%, 100% { opacity: 0.18; }
    }

    .ok { animation: ok 6s linear infinite; }
    @keyframes ok {
      0%, 23%   { opacity: 0; }
      27%, 36%  { opacity: 1; }
      40%, 100% { opacity: 0; }
    }

    .warn { animation: warn 6s linear infinite; }
    @keyframes warn {
      0%, 59%   { opacity: 0; }
      63%, 90%  { opacity: 1; }
      96%, 100% { opacity: 0; }
    }
  </style>

  <rect width="1080" height="1080" fill="#f7f5f0"/>

  <!-- Title -->
  <rect x="60" y="72" width="10" height="112" rx="5" fill="#2547d0"/>
  <text x="96" y="122" font-size="58" font-weight="800" fill="#1b1d21">Agents don't fail.</text>
  <text x="96" y="186" font-size="58" font-weight="800" fill="#2547d0">Handoffs do.</text>

  <!-- Agent cards -->
  <g font-size="30" font-weight="700" fill="#1b1d21" text-anchor="middle">
    <g>
      <rect x="60" y="270" width="240" height="220" rx="20" fill="#fff" stroke="#1b1d21" stroke-width="3"/>
      <rect x="140" y="310" width="80" height="80" rx="16" fill="#e8ecfb" stroke="#2547d0" stroke-width="3"/>
      <circle cx="166" cy="345" r="7" fill="#2547d0"/><circle cx="194" cy="345" r="7" fill="#2547d0"/>
      <rect x="160" y="364" width="40" height="6" rx="3" fill="#2547d0"/>
      <text x="180" y="448">Intake</text>
    </g>
    <g>
      <rect x="420" y="270" width="240" height="220" rx="20" fill="#fff" stroke="#1b1d21" stroke-width="3"/>
      <rect x="500" y="310" width="80" height="80" rx="16" fill="#e8ecfb" stroke="#2547d0" stroke-width="3"/>
      <circle cx="526" cy="345" r="7" fill="#2547d0"/><circle cx="554" cy="345" r="7" fill="#2547d0"/>
      <rect x="520" y="364" width="40" height="6" rx="3" fill="#2547d0"/>
      <text x="540" y="448">Planner</text>
    </g>
    <g>
      <rect x="780" y="270" width="240" height="220" rx="20" fill="#fff" stroke="#1b1d21" stroke-width="3"/>
      <rect x="860" y="310" width="80" height="80" rx="16" fill="#e8ecfb" stroke="#2547d0" stroke-width="3"/>
      <circle cx="886" cy="345" r="7" fill="#2547d0"/><circle cx="914" cy="345" r="7" fill="#2547d0"/>
      <rect x="880" y="364" width="40" height="6" rx="3" fill="#2547d0"/>
      <text x="900" y="448">Executor</text>
    </g>
  </g>

  <!-- Arrows between agents -->
  <g stroke="#1b1d21" stroke-width="5" fill="none" stroke-linecap="round">
    <path class="march" d="M308 380 H404"/>
    <path class="march" d="M668 380 H764"/>
  </g>
  <g fill="#1b1d21">
    <path d="M404 368 L418 380 L404 392 Z"/>
    <path d="M764 368 L778 380 L764 392 Z"/>
  </g>

  <!-- Handoff zones on the context lane -->
  <rect x="300" y="590" width="120" height="100" rx="14" fill="#2f9e6a" opacity="0.18"/>
  <rect class="flash" x="660" y="590" width="120" height="100" rx="14" fill="#e8613c"/>
  <g font-size="22" font-weight="700" text-anchor="middle">
    <text x="360" y="720" fill="#2f9e6a">handoff 1</text>
    <text x="720" y="720" fill="#e8613c">handoff 2</text>
  </g>

  <!-- Context lane -->
  <path class="march" d="M180 640 H900" stroke="#9aa1ad" stroke-width="4" fill="none"/>
  <g fill="#9aa1ad"><circle cx="180" cy="640" r="9"/><circle cx="540" cy="640" r="9"/><circle cx="900" cy="640" r="9"/></g>

  <!-- Status callouts -->
  <g class="ok">
    <rect x="440" y="508" width="200" height="50" rx="25" fill="#2f9e6a"/>
    <text x="540" y="542" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">✓ full context</text>
  </g>
  <g class="warn">
    <rect x="770" y="508" width="260" height="50" rx="25" fill="#e8613c"/>
    <text x="900" y="542" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">⚠ acting on 1 of 3</text>
  </g>

  <!-- Context packet: goal / constraints / history -->
  <g class="packet">
    <rect x="-54" y="-44" width="108" height="88" rx="12" fill="#fff" stroke="#1b1d21" stroke-width="3"/>
    <rect x="-40" y="-30" width="80" height="16" rx="4" fill="#2547d0"/>
    <rect class="lost" x="-40" y="-8" width="80" height="16" rx="4" fill="#e3a52b"/>
    <rect class="lost b" x="-40" y="14" width="80" height="16" rx="4" fill="#8f5bd8"/>
  </g>

  <!-- Legend -->
  <g font-size="24" fill="#5d6470">
    <rect x="200" y="768" width="22" height="22" rx="4" fill="#2547d0"/><text x="232" y="787">goal</text>
    <rect x="330" y="768" width="22" height="22" rx="4" fill="#e3a52b"/><text x="362" y="787">constraints</text>
    <rect x="520" y="768" width="22" height="22" rx="4" fill="#8f5bd8"/><text x="552" y="787">history</text>
    <text x="680" y="787">= the context packet</text>
  </g>

  <!-- Framework -->
  <rect x="60" y="830" width="960" height="190" rx="20" fill="#1b1d21"/>
  <text x="100" y="878" font-size="30" font-weight="800" fill="#fff">Design the seams, not just the steps</text>
  <g font-size="25" fill="#d9dce3">
    <text x="100" y="928">1. Write a handoff contract: what must cross</text>
    <text x="100" y="964">2. Log every handoff, not only every output</text>
    <text x="100" y="1000">3. Verify at the seam, with a separate checker</text>
  </g>
</svg>
