  <!-- Generated by scripts/visuals/practice_exam_hybrid.py. Pixel students, flat scores; one 6s loop. -->
  <style>
    .px rect, .px path { shape-rendering: crispEdges; }
    .march { stroke-dasharray: 16 16; animation: march 0.6s steps(4) infinite; }
    @keyframes march { to { stroke-dashoffset: -32; } }
    .bob { animation: bob 0.6s steps(1) infinite; }
    @keyframes bob { 0% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    /* Pixel half: stepped. */
    .answer { animation: answer 6s steps(1) infinite; }
    @keyframes answer { 0% { opacity: 0; } 8% { opacity: 1; } 48% { opacity: 0; } }
    .confused { animation: confused 6s steps(1) infinite; }
    @keyframes confused { 0% { opacity: 0; } 54% { opacity: 1; } 94% { opacity: 0; } }

    /* Flat half: smooth. */
    .bar { transform-box: fill-box; transform-origin: left center; animation-duration: 6s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .practice-label, .phase-practice { animation: practice 6s linear infinite; }
    @keyframes practice { 0%, 6% { opacity: 0; } 12%, 44% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .exam-label, .phase-exam { animation: exam 6s linear infinite; }
    @keyframes exam { 0%, 50% { opacity: 0; } 56%, 90% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes bar0 { 0% { transform: scaleX(0); } 12%, 46% { transform: scaleX(1); } 54%, 92% { transform: scaleX(1.000); } 98%, 100% { transform: scaleX(0); } }
    @keyframes bar1 { 0% { transform: scaleX(0); } 12%, 46% { transform: scaleX(1); } 54%, 92% { transform: scaleX(0.561); } 98%, 100% { transform: scaleX(0); } }
    @keyframes bar2 { 0% { transform: scaleX(0); } 12%, 46% { transform: scaleX(1); } 54%, 92% { transform: scaleX(0.441); } 98%, 100% { transform: scaleX(0); } }
  </style>
