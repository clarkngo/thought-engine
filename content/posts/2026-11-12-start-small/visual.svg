    @keyframes on0 { 0% { opacity: 0.15; } 0% { opacity: 1; } }
    .on1 { animation: on1 6s steps(1) infinite; }
    @keyframes on1 { 0% { opacity: 0.15; } 25% { opacity: 1; } }
    .on2 { animation: on2 6s steps(1) infinite; }
    @keyframes on2 { 0% { opacity: 0.15; } 50% { opacity: 1; } }
    .on3 { animation: on3 6s steps(1) infinite; }
    @keyframes on3 { 0% { opacity: 0.15; } 75% { opacity: 1; } }
  </style>
