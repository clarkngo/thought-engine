<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Generated by scripts/visuals/seams.py. One 6s loop. -->
  <style>
    rect, path { shape-rendering: crispEdges; }
    .march { stroke-dasharray: 16 16; animation: march 0.6s steps(4) infinite; }
    @keyframes march { to { stroke-dashoffset: -32; } }
    .bob { animation: bob 0.6s steps(1) infinite; }
    @keyframes bob { 0% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    .crack, .fail, .tint { opacity: 0; animation-duration: 6s; animation-iteration-count: infinite; animation-timing-function: steps(1); }
    .stitch, .fix { animation: stitch 6s steps(1) infinite; }
    @keyframes stitch { 0% { opacity: 0; } 64% { opacity: 1; } 94% { opacity: 0; } }

    @keyframes c0 { 0% { opacity: 0; } 8% { opacity: 1; } 10% { opacity: 0.3; }
      12% { opacity: 1; } 62% { opacity: 0; } }
    @keyframes f0 { 0% { opacity: 0; } 8% { opacity: 1; } 94% { opacity: 0; } }
    @keyframes t0 { 0% { opacity: 0; } 10% { opacity: 0.22; } 62% { opacity: 0; } }
    .c0 { animation-name: c0; } .f0 { animation-name: f0; } .t0 { animation-name: t0; }
    @keyframes c1 { 0% { opacity: 0; } 24% { opacity: 1; } 26% { opacity: 0.3; }
      28% { opacity: 1; } 62% { opacity: 0; } }
    @keyframes f1 { 0% { opacity: 0; } 24% { opacity: 1; } 94% { opacity: 0; } }
    @keyframes t1 { 0% { opacity: 0; } 26% { opacity: 0.22; } 62% { opacity: 0; } }
    .c1 { animation-name: c1; } .f1 { animation-name: f1; } .t1 { animation-name: t1; }
    @keyframes c2 { 0% { opacity: 0; } 40% { opacity: 1; } 42% { opacity: 0.3; }
      44% { opacity: 1; } 62% { opacity: 0; } }
    @keyframes f2 { 0% { opacity: 0; } 40% { opacity: 1; } 94% { opacity: 0; } }
    @keyframes t2 { 0% { opacity: 0; } 42% { opacity: 0.22; } 62% { opacity: 0; } }
    .c2 { animation-name: c2; } .f2 { animation-name: f2; } .t2 { animation-name: t2; }
  </style>
