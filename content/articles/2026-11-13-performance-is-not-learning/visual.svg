  <!-- Generated by scripts/visuals/performance_learning.py. One 6s loop. -->
  <style>
    rect, path { shape-rendering: crispEdges; }
    .march { stroke-dasharray: 16 16; animation: march 0.6s steps(4) infinite; }
    @keyframes march { to { stroke-dashoffset: -32; } }
    .bob { animation: bob 0.6s steps(1) infinite; }
    @keyframes bob { 0% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .ride { animation: ride 6s steps(1) infinite; }
    @keyframes ride { 0% { transform: translate(0px, 0px); } 16% { transform: translate(140px, 0px); } 32% { transform: translate(280px, 0px); } 48% { transform: translate(420px, 0px); } 64% { transform: translate(540px, 0px); } 80% { transform: translate(720px, 242px); } }
    .bot { animation: bot 6s steps(1) infinite; }
    @keyframes bot { 0% { transform: translate(0, 0); opacity: 1; } 16% { transform: translate(140px, 0); }
      32% { transform: translate(280px, 0); } 48% { transform: translate(420px, 0); }
      64% { transform: translate(540px, 0); opacity: 1; } 80% { opacity: 0; } }
    .drop { animation: drop 6s steps(1) infinite; }
    @keyframes drop { 0% { opacity: 0; } 80% { opacity: 1; } }
  </style>
